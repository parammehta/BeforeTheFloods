name: Refresh data

# Re-pulls World Bank + Our World in Data figures monthly and opens a PR if
# anything changed. This is the fix for the underlying problem: the 2017 site
# was never wrong on the day it launched, it just had no way to update itself.
on:
  schedule:
    - cron: '17 6 1 * *' # 06:17 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run fetch-data

      - uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'data: refresh from World Bank and Our World in Data'
          title: 'Data refresh'
          body: Automated monthly pull. Review the coverage.json diff, then merge.
          branch: data-refresh
          add-paths: public/data
